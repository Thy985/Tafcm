name: formula_fix
description: "FormulaFix - 移动端 Typora 类 Markdown 写作工具，以公式 / 图表 / 学术写作为特色。"
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.4.9

  # 路由
  go_router: ^12.1.1

  # 本地存储 / 文件
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  file_picker: ^8.0.0
  path: ^1.9.0

  # 分享
  share_plus: ^7.2.1

  # 公式 / 图表渲染
  flutter_math_fork: ^0.7.2
  flutter_svg: ^2.0.9
  flutter_inappwebview: ^6.0.0

  # 代码语法高亮（Phase 3.2 §3.2.10）
  flutter_highlight: ^0.7.0

  # 导出
  pdf: 3.10.7
  archive: ^3.4.9
  xml: 6.4.2
  vector_math: ^2.1.4

  # 工具
  crypto: ^3.0.3
  uuid: ^4.3.3
  intl: ^0.18.1
  golden_toolkit: ^0.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  integration_test:
    sdk: flutter

dependency_overrides:
  # 锁定 inappwebview 全家桶到稳定版，避免 pub 选择 beta 版本
  flutter_inappwebview_platform_interface: 1.3.0+1
  flutter_inappwebview_ios: 1.1.2
  flutter_inappwebview_macos: 1.1.2
  flutter_inappwebview_web: 1.1.2

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    # WebView 公式/图表渲染资产（MermaidRendererHost 经 loadFile 加载）：
    # mermaid_renderer.html + js/tex-svg.js (MathJax 3.2.2) + js/mermaid.min.js。
    # 曾在历史提交 8bfe76a 引入（LFS），后随 pubspec 精简意外脱落——导致主线
    # FormulaSvgService/MermaidService 的真实 SVG 路径静默降级（T3-2 E2E 暴露）。
    - assets/mermaid_renderer.html
    - assets/js/

  # Tier 2 (TEST_GAP_PLAN T2-0/T2-1)：打包视觉关键字体，消除跨平台字体渲染
  # 差异（GOLDEN-CI-001 根因）。serif/sans/mono 全部改为单一打包字族名：
  # - NotoSerifSC / NotoSansSC：OFL，含 Latin + CJK（正文/标题/UI/中文）。
  # - CascadiaMono：OFL（Cascadia Code 家族），等宽（行内代码/公式源码/状态栏）。
  # 三者均经 pubspec 注册，golden_toolkit loadAppFonts() 显式加载，禁止平台回退。
  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
    - family: CascadiaMono
      fonts:
        - asset: assets/fonts/CascadiaMono.ttf

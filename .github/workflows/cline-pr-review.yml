# PR 自动代码审查 — Cline CLI + AGNES OpenAI-compatible 端点
# 官方示例: https://docs.cline.bot/cli/samples/github-pr-review
name: PR Code Review (Cline)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

jobs:
  cline-pr-review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm install -g cline

      # AGNES 网关：OpenAI-compatible（/v1/chat/completions 实测 200）
      # Cline provider id "openai" = OpenAI-compatible，-b 指定 base URL
      - name: Configure Cline Authentication (AGNES)
        run: |
          cline auth -p openai \
            -k "${{ secrets.AGNES_API_KEY }}" \
            -m agnes-2.5-flash \
            -b https://apihub.agnes-ai.com/v1

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Review PR with Cline
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GITHUB_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          # 限制 Cline 仅可执行安全的只读 gh 命令 + 回贴审查
          CLINE_COMMAND_PERMISSIONS: |
            {
              "allow": [
                "gh pr diff *",
                "gh pr view *",
                "gh pr checks *",
                "gh pr list *",
                "gh issue list *",
                "gh issue view *",
                "git log *",
                "gh pr comment ${{ steps.pr.outputs.number }} *",
                "gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments *",
                "gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/reviews *"
              ]
            }
        run: |
          cline --auto-approve true 'You are a GitHub PR reviewer for this repository. Your goal is to give the PR author helpful feedback and give maintainers the context they need to review efficiently.

          PR: #'"${PR_NUMBER}"'

          ## Gather context
          Use `gh` commands to fetch the PR diff, details, and checks.

          ```bash
          # Get full PR details
          gh pr view '"${PR_NUMBER}"' --json number,title,body,author,createdAt,updatedAt,isDraft,labels,commits,files,additions,deletions,changedFiles,baseRefName,headRefName,mergeable,reviewDecision

          # Get the diff
          gh pr diff '"${PR_NUMBER}"'

          # Check CI status
          gh pr checks '"${PR_NUMBER}"'

          # Get existing review comments
          gh api repos/${{ github.repository }}/pulls/'"${PR_NUMBER}"'/comments --jq '"'"'.[] | {user: .user.login, body: .body, path: .path, created_at: .created_at}'"'"'

          # Get conversation comments
          gh pr view '"${PR_NUMBER}"' --comments
          ```

          ## Review focus
          Focus on the actual changes in the diff:
          - Correctness: bugs, edge cases, race conditions
          - Security: injection, secrets, auth, unsafe deserialization
          - Maintainability: duplication, naming, dead code, complexity
          - Tests: are new behaviors covered?
          - API compatibility: does this break existing interfaces or callers?
          Be concise and specific. Flag real issues, not style nits.

          ## Posting feedback
          For concrete code improvements, use GitHub suggestion syntax via `gh api` to create inline suggestions the author can commit with one click:

          ```bash
          gh api repos/${{ github.repository }}/pulls/'"${PR_NUMBER}"'/reviews \
            -X POST \
            -f commit_id="$(gh pr view '"${PR_NUMBER}"' --json headRefOid -q .headRefOid)" \
            -f event="COMMENT" \
            -f body="Review summary" \
            -F comments='"'"'[{"path":"src/example.ts","line":42,"body":"Consider simplifying:\\n\\n```suggestion\\nconst result = items.filter(Boolean);\\n```"}]'"'"'
          ```

          Use inline suggestions for concrete improvements. Use regular comments (via `gh pr comment`) for questions or broader feedback.

          ## Final output
          End your review with a PR comment containing:
          - 总体结论：✅可以合并 / ⚠️建议修改后合并 / ❌需重大修改
          - 要点清单（问题 → 位置 → 建议）
          - Output in Chinese.
          '

      - name: 审查完成标记
        run: echo "Cline PR review completed for #${{ steps.pr.outputs.number }}"

# PR 自动代码审查 — Cline CLI + 模型降级链（.agent/tafcm-maintainer/models.json）
# 官方示例: https://docs.cline.bot/cli/samples/github-pr-review
# 提示词单一真相源: .agent/tafcm-maintainer/PR_REVIEW_PROMPT.md
# cline 调用统一走 .github/scripts/tafcm-maintainer/cline_fallback_runner.py
name: PR Code Review (Cline)

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

jobs:
  cline-pr-review:
    if: |
      (github.event_name == 'pull_request' && github.event.pull_request.draft == false) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Cline CLI
        run: npm install -g cline

      - name: Get PR number
        id: pr
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Review PR with Cline
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GH_TOKEN: ${{ github.token }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          # 限制 Cline 仅可执行安全的只读 gh 命令 + 回贴审查
          CLINE_COMMAND_PERMISSIONS: |
            {
              "allow": [
                "gh pr diff *",
                "gh pr view *",
                "gh pr checks *",
                "gh pr list *",
                "gh issue list *",
                "gh issue view *",
                "git log *",
                "gh pr comment ${{ steps.pr.outputs.number }} *",
                "gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/comments *",
                "gh api repos/${{ github.repository }}/pulls/${{ steps.pr.outputs.number }}/reviews *"
              ]
            }
        run: |
          mkdir -p .tmp/cline-pr-review
          python3 .github/scripts/tafcm-maintainer/cline_fallback_runner.py \
            --config .agent/tafcm-maintainer/models.json \
            --prompt-file .agent/tafcm-maintainer/PR_REVIEW_PROMPT.md \
            --output-model-file .tmp/cline-pr-review/model_used.json \
            --var PR_NUMBER="${PR_NUMBER}" \
            --var GH_REPO="${{ github.repository }}"


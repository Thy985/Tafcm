name: CI

# 触发作用域收敛（Repository Reliability System ③）：
# - push 仅监听 main → 主干合入后的 Release CI；feature 分支 push 不再触发，
#   彻底消除「同 commit 跑 push+PR 两次」的双触发。
# - pull_request 仅监听 main → feature 分支统一由 PR 触发验证。
# 配合 .github/workflows/branch-cleanup.yml 做生命周期闭环。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 手动触发基线更新：Actions 页选 CI → Run workflow → 勾选 update_goldens。
  # 之前每次视觉变更都要手改 ci.yml 切 --update-goldens 再改回来，现在一键完成。
  workflow_dispatch:
    inputs:
      update_goldens:
        description: '在 Linux 上重新生成 golden 基线（产出 golden-baselines artifact）'
        type: boolean
        default: false

# 同一 PR 新推送时取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.6'
  # 过渡期兼容：部分 action（flutter-action v2.x）尚未完全适配 Node 24
  # 待 subosito/flutter-action 发布 Node 24 原生支持后移除
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
  # Tier 2 (TEST_GAP_PLAN T2-0)：固定 CI 镜像版本，杜绝镜像升级引发的
  # 字体/渲染漂移（GOLDEN-CI-001 根因之一）。ubuntu-latest 是浮动镜像，
  # 升级会静默改变渲染基线。
  CI_IMAGE: 'ubuntu-24.04'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Show Flutter version
        run: flutter --version

      - name: Download dependencies
        run: flutter pub get

      - name: Run analyze
        run: flutter analyze --no-fatal-infos --fatal-warnings

  test:
    name: Test
    runs-on: ubuntu-24.04
    needs: analyze
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Download dependencies
        run: flutter pub get

      - name: Run tests
        # `--exclude-tags golden` 排除带 `@Tags(['golden'])` 的测试文件。
        # Golden 跨平台字体渲染差异（CI 0.09% 像素）会导致 flake，
        # 由独立 golden job 处理（当前 if: false 暂停，见下方）。
        # 详见 docs/TEST_SKIP_REGISTRY.md GOLDEN-CI-001。
        run: flutter test --exclude-tags golden --exclude-tags perf --reporter expanded $(find test -name "*_test.dart" ! -path "test/golden/*")

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-coverage
          path: flutter_app/coverage/

  # ADI（Agent Diagnostic Interface）E2E 测试 job — 纯 Dart CLI 协议闭环验证。
  # 见 docs/ADR/0024 §9 E2E Test Plan。tools/adi 不依赖 Flutter runtime，
  # 仅用 Flutter action 提供的 Dart SDK 即可（`dart pub get` / `dart test`）。
  adi-e2e:
    name: ADI E2E (Agent Diagnostic Protocol)
    runs-on: ubuntu-24.04
    needs: analyze
    defaults:
      run:
        working-directory: tools/adi
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart (via Flutter SDK)
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download dependencies
        run: dart pub get

      - name: Run analyze
        run: dart analyze

      - name: Run E2E tests
        run: dart test --reporter expanded

  # Golden UI 测试 job — 常驻比对模式（GOLDEN-CI-001 已销案，2026-07-28）
  #
  # 根因（跨平台字体渲染差异 0.09% / 4007px diff）已通过 Tier 2 环境三固定
  # 根除：CI 镜像固定 ubuntu-24.04、Flutter 3.44.6 固定、pubspec 打包
  # NotoSerifSC / NotoSansSC / CascadiaMono 且 golden 测试 setUpAll 显式
  # loadAppFonts()、固定 locale=en_US / textScaleFactor=1.0 / viewport 800×1200。
  #
  # 基线由 Linux CI 生成并提交仓库（golden-baselines artifact 落库，实际落点
  # test/golden/golden/*.png），禁用 Windows 本机基线。
  #
  # 本 job 现每次 push/PR 跑 `flutter test --tags golden` 与 Linux 基线比对，
  # 任何像素 diff 即失败（视觉回归保护）。解封条件全部满足。
  #
  # 后续观测（G4 验收项「试点 10 连绿」）：保持本 job 常驻，观察连续 10 次
  # CI 运行 0 随机 diff 即达成。失败时 artifact golden-diffs 提供比对图。
  golden:
    name: Golden (compare)
    runs-on: ubuntu-24.04
    needs: analyze
    if: true  # GOLDEN-CI-001 销案：常驻比对模式
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Download dependencies
        run: flutter pub get

      - name: Run golden tests (compare mode)
        run: flutter test --tags golden --reporter expanded

      - name: Upload golden diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: flutter_app/test/golden/failures/

  # 手动触发的基线更新 job（workflow_dispatch + update_goldens=true 时运行）。
  # 产出 golden-baselines artifact，下载后拷入 test/golden/golden/ 提交即可：
  #   gh run download <run-id> --name golden-baselines --dir /tmp/gb
  #   cp /tmp/gb/*.png flutter_app/test/golden/golden/
  # 本地替代方案：tool/wsl_golden.sh --update（WSL Ubuntu，无需等 CI）。
  golden-update:
    name: Golden (update baselines)
    runs-on: ubuntu-24.04
    if: github.event_name == 'workflow_dispatch' && inputs.update_goldens
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download dependencies
        run: flutter pub get

      - name: Regenerate golden baselines
        run: flutter test --tags golden --update-goldens --reporter expanded

      - name: Upload new baselines
        uses: actions/upload-artifact@v4
        with:
          name: golden-baselines
          path: flutter_app/test/golden/golden/

  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-24.04
    needs: test
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/android/**/*.gradle*', 'flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.FLUTTER_VERSION }}-
            ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug --no-pub

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: flutter_app/build/app/outputs/flutter-apk/

  # C-01 实验（2026-09-04，Doubao Supervisor 起草，Human 合入后触发）：
  # 在 Android 模拟器执行 Tafcm 已存在的 device 级 integration_test
  # （IntegrationTestWidgetsFlutterBinding，Tier 4 真机冒烟设计）。
  # 目标：验证"CI 能真正构建并运行 APK"这一架构决策，补齐 emulator_runtime 空白。
  # 最小版：纯链路 smoke + 真实 App 首页冒烟；formula/export/physical-render 后续扩展。
  android-device:
    name: Android Device Integration (emulator)
    runs-on: ubuntu-24.04
    needs: test
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ env.FLUTTER_VERSION }}-${{ hashFiles('flutter_app/android/**/*.gradle*', 'flutter_app/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ env.FLUTTER_VERSION }}-
            ${{ runner.os }}-gradle-

      - name: Download dependencies
        run: flutter pub get

      - name: Run device integration tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        # C-01 review 修复（Human）：默认 6min 超时在 AVD 冷启动+首次 build 时易触顶，
        # 显式放宽到 20min，避免基础设施慢被误报为实验失败。
        # C-01 三次执行（2026-09-04）：GitHub 免费 runner 无 KVM，软件模拟极慢——
        # boot ~9min + gradle 133s + install 191s 已吃掉 20min，测试未跑完即超时。
        # 第四轮：timeout 40min + 先只跑 smoke（最小编译/无 UI 依赖），验证运行层链路。
        timeout-minutes: 40
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          # C-01 二次失败根因：android-emulator-runner 的 script 在仓库根目录执行
          # （不受 job defaults.working-directory 影响），找不到 flutter_app/pubspec.yaml
          working-directory: flutter_app
          # 注意：android-emulator-runner 的 script 参数按行拆分，每行独立 sh -c 执行
          # （parseScript: split by newline, trim, 过滤 # 行）→ 不支持跨行 if/fi 结构。
          # 因此整段逻辑必须压成单行（分号分隔，if/fi 同行闭合）。
          # 语义：timeout 900s 跑 smoke；非 0/124=失败；124 但日志无 ✅=超时未完成=失败；
          #       124 且日志有 ✅=测试完成仅进程 hang=通过；正常退出=通过。
          script: >-
            set +e; timeout 900 flutter test integration_test/smoke_test.dart -d emulator-5554 > flutter_test.log 2>&1; EXIT=$?;
            if [ $EXIT -ne 0 ] && [ $EXIT -ne 124 ]; then echo "FLUTTER_TEST_FAILED exit=$EXIT"; tail -30 flutter_test.log; exit $EXIT; fi;
            if [ $EXIT -eq 124 ] && ! grep -q "smoke test: 1+1=2" flutter_test.log; then echo "TIMEOUT_BEFORE_TEST_COMPLETION"; exit 124; fi;
            echo "FLUTTER_TEST_PASSED exit=$EXIT" 

  build-web:
    name: Build Web
    runs-on: ubuntu-24.04
    needs: test
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Download dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --no-pub

      - name: Upload Web bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: flutter_app/build/web/

  # Issue Triage 工作流架构守门（ADR-0025 D1/D6/D10）
  # 拦截方式：任何 issue-triage.yml 的权限/依赖/并发结构越界都让 CI 失败。
  # 不依赖 Flutter runtime，python3 stdlib + 正则即可。
  issue-triage-architecture:
    name: Issue Triage Architecture Test (ADR-0025)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify issue-triage.yml present
        run: 'test -f .github/workflows/issue-triage.yml || { echo "FAIL: issue-triage.yml missing"; exit 1; }'

      - name: Run architecture invariants check
        run: python3 .github/scripts/issue-triage/architecture_test.py

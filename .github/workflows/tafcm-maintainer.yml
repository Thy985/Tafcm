# ============================================================================
# tafcm-maintainer.yml — Tafcm Maintainer Agent 每日维护审查
#
# 设计（.agent/tafcm-maintainer/POLICY.md §3 运行流程）：
#   schedule(每天) + workflow_dispatch → Cline Headless 审查 → validate → INDEX 更新
#   → Action commit+push（Cline 无 push 权限）→ report + email
#
# 权限（最小化，POLICY.md §2）：
#   workflow 级: contents:write(提交 audit) + issues:write(建 Issue)
#                + pull-requests:read + actions:read
#   无 administration:write / secrets:write / 其他非必要写权限
#
# 失败语义（POLICY.md §6）：
#   - Cline 失败 / Audit 未生成 / 格式校验失败 / 越权改动 → workflow FAILED
#   - Audit 成功 + 邮件失败 → workflow 仍 SUCCESS，但明确报告
#     "Audit completed but email delivery failed."（不伪装全成功）
#
# 复用：模型降级链 .agent/tafcm-maintainer/models.json（单一真相，与
#       cline-pr-review.yml 共用）+ runner .github/scripts/tafcm-maintainer/
#       cline_fallback_runner.py（失败分类降级，密钥只走 env 注入）
#       Flutter 3.44.6 / ubuntu-24.04（与 ci.yml 一致）
# ============================================================================
name: tafcm-maintainer

on:
  schedule:
    # 每日 17:23 UTC（北京时间次日 01:23）——非整点，避开整点流量高峰；主审查 + 立即邮件
    - cron: '23 17 * * *'
    # 周五 10:00 UTC（18:00 北京时间）——Weekly Digest 邮件（独立 job，不跑审查）
    - cron: '0 10 * * 5'
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Audit 提交推送的目标分支（默认 main）'
        type: string
        required: false
        default: 'main'
      run_tests:
        description: '是否运行 flutter analyze / flutter test（默认 true）'
        type: boolean
        required: false
        default: true
      force_digest:
        description: '仅发送 Weekly Digest 邮件（不跑审查；手动测试用）'
        type: boolean
        required: false
        default: false

# 避免 schedule 与手动触发并发互相覆盖；已在跑的 run 不取消（防止 Audit 中途丢失）
concurrency:
  group: tafcm-maintainer-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write        # 提交 docs/agent-audit/ 产物
  issues: write          # 创建 Agent Issue
  pull-requests: read    # 读 PR 上下文
  actions: read          # 读 CI 状态
  # 明确不给：administration / secrets / packages / deployments / id-token / security-events

env:
  FLUTTER_VERSION: '3.44.6'
  CLINE_VERSION: '3.0.60'                     # 锁定 Cline 版本，防每日漂移
  MODELS_CONFIG: '.agent/tafcm-maintainer/models.json'
  FALLBACK_RUNNER: '.github/scripts/tafcm-maintainer/cline_fallback_runner.py'
  AUDIT_DIR: 'docs/agent-audit'
  INVESTIGATIONS_DIR: 'docs/agent-investigations'
  TARGET_BRANCH: ${{ inputs.target_branch || 'main' }}

jobs:
  maintainer-audit:
    name: Maintainer Audit
    # 每日北京时间 01:23（UTC 17:23）或手动触发时跑主审查；周五 digest run 与 force_digest 手动触发跳过
    if: github.event.schedule != '0 10 * * 5' && github.event.inputs.force_digest != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      # ---------- 0. 上下文 ----------
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------- 0.5 Eligibility Gate（P0-1，影子模式）----------
      # 只记录判定，不参与放行：Cline 仍每晚执行。目的是先用真实夜晚攒出
      # gate_skip_rate 与阈值校准数据，再决定让闸门真正接管激活
      # （见 .github/仓库Agent设计与治理.md §3.1 / §5）。
      # continue-on-error 是影子阶段的刻意选择——闸门自身缺陷不得红掉夜间管道，
      # 缺陷本身会在 artifact 与 step summary 里留痕。
      - name: Eligibility Gate (shadow)
        id: gate
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/tafcm-maintainer
          # 账本 → 真实陈旧度 → 领域分配（P0-2 把这条闭环接上；账本尚不存在时
          # state 输出空 dimension_state，gate 退回"缺数据不算陈旧"的保守判定）
          python3 .github/scripts/tafcm-maintainer/ledger.py state \
            --out .tmp/tafcm-maintainer/ledger-state.json
          python3 .github/scripts/tafcm-maintainer/eligibility_gate.py \
            --state-file .tmp/tafcm-maintainer/ledger-state.json \
            --output .tmp/tafcm-maintainer/gate-result.json \
            --summary "$GITHUB_STEP_SUMMARY" \
            --github-output "$GITHUB_OUTPUT"

      # 影子期的指标依赖"每夜 gate 真的跑了"。continue-on-error 会让失败步骤显示
      # success，gate 缺席的夜晚必须显式标注，否则 gate_skip_rate 的分母是假的。
      # 同时落一个可机读终态：artifact 里缺 gate-result.json 本身无法区分"没跑"
      # 与"跑崩"，分母剔除需要机器可读的来源。
      # 注意这是 gate-failure.json，不冒充 gate-result（后者 required 字段更多）。
      - name: Alert — Eligibility Gate 本夜未产出判定
        if: steps.gate.outcome == 'failure'
        run: |
          set -euo pipefail
          mkdir -p .tmp/tafcm-maintainer
          TODAY="$(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          cat > .tmp/tafcm-maintainer/gate-failure.json <<JSON
          {"schema_version":"1.0","status":"gate_failed","run_date":"${TODAY}","run_id":"${GITHUB_RUN_ID}","gate_result_produced":false,"note":"本夜必须从 gate_skip_rate / agent_activation_rate 的分母中剔除"}
          JSON
          {
            echo "## [ALERT] Eligibility Gate 未产出判定"
            echo ""
            echo "- 本夜 gate 步骤失败（已被 continue-on-error 放行，夜间审查不受影响）"
            echo "- **本夜不计入影子期指标**（分母剔除依据：artifact 内的 gate-failure.json）"
            echo "- 排查：本步骤日志的 traceback；对照 .github/仓库Agent设计与治理.md §3.9"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::Eligibility Gate 未产出判定——本夜不计入影子期指标"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            flutter_app/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('flutter_app/pubspec.yaml', 'flutter_app/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      # ---------- 1. Cline Runtime ----------
      - name: Install Cline CLI (pinned)
        run: npm install -g cline@${{ env.CLINE_VERSION }}

      - name: Diagnose Cline CLI
        run: |
          which cline
          cline --version

      # ---------- 1.5 确保 Issue 标签存在（source:agent / type:* / priority:*）----------
      - name: Ensure issue labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/tafcm-maintainer/ensure_labels.py

      # ---------- 2. 运行 Maintainer Agent（Headless，只读 + 写 Audit + 建 Issue）----------
      - name: Run Maintainer Agent (Cline Headless)
        id: cline
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # 命令权限（POLICY.md §2.3）——只允许维护与验证所需命令
          CLINE_COMMAND_PERMISSIONS: |
            {
              "allow": [
                "git status",
                "git log *",
                "git diff *",
                "git show *",
                "git grep *",
                "flutter analyze *",
                "flutter test *",
                "flutter pub deps *",
                "python *",
                "python3 *",
                "pytest *",
                "gh issue list *",
                "gh issue view *",
                "gh issue create *",
                "gh issue comment *",
                "gh pr list *",
                "gh pr view *",
                "gh run list *",
                "gh run view *"
              ],
              "deny": [
                "git push *",
                "git reset *",
                "git clean *",
                "git checkout *",
                "rm -rf *",
                "rm *",
                "sudo *",
                "gh repo edit *",
                "gh secret *",
                "gh workflow *",
                "gh release *",
                "gh pr create *",
                "gh pr merge *",
                "gh pr comment *",
                "gh api *"
              ]
            }
        run: |
          set -euo pipefail
          mkdir -p .tmp/tafcm-maintainer
          TODAY="$(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          echo "TODAY=$TODAY" >> "$GITHUB_OUTPUT"

          # PROMPT.md 为行为协议；追加当日运行上下文
          PROMPT="$(cat .agent/tafcm-maintainer/PROMPT.md)"
          RECENT_DIFF="$(git log -5 --format='%h %s' && echo '---' && git diff HEAD~1..HEAD --stat 2>/dev/null | tail -15 || true)"
          RUN_CTX="

          ---
          ## 本次运行上下文（Run Context）
          - 运行日期（UTC）：${TODAY}
          - HEAD commit：$(git rev-parse HEAD)
          - 仓库：Thy985/Tafcm
          - 目标分支：${TARGET_BRANCH}
          - 请生成 Audit 文件：docs/agent-audit/${TODAY}-maintainer-audit.md
          - 本次运行前请先阅读 docs/agent-audit/INDEX.md 与近期 Audit（去重）
          - **最近 5 个 commit 与最近变更（必须审查，不得跳过）**：
            ${RECENT_DIFF}
          "
          # Cline CLI 3.x headless：仅 --auto-approve true + prompt（官方文档与
          # cline-pr-review.yml 验证用法；--output-format 等选项不存在）
          printf '%s' "${PROMPT}${RUN_CTX}" > .tmp/tafcm-maintainer/prompt_main.txt
          python3 "$FALLBACK_RUNNER" \
            --config "$MODELS_CONFIG" \
            --prompt-file .tmp/tafcm-maintainer/prompt_main.txt \
            --output-model-file .tmp/tafcm-maintainer/model_used_main.json

      # ---------- 2.5 兜底：保证每日 audit 文件存在（Issue #288）----------
      # Cline 偶发在"无 significant findings"日未正常产出 audit，导致每日
      # 连续性断裂。此处兜底：若当日文件缺失，自动生成一个满足
      # validate_audit.py 格式的 "No significant findings." 兜底文件，
      # 使 Verify/INDEX/Registry/Commit 全部照常执行，保持每日 audit 连续。
      - name: Ensure daily audit exists (Issue #288 fallback)
        run: |
          python3 .github/scripts/tafcm-maintainer/ensure_daily_audit.py \
            docs/agent-audit \
            --date "$(TZ='Asia/Shanghai' date +%Y-%m-%d)"

      # ---------- 3. 校验（Audit 生成失败不得伪装成成功）----------
      # 兜底后此 guard 仍保留：若连"自动兜底"都失败（目录不可写等），
      # workflow 才会真正 FAILED（不伪装成功）。
      - name: Verify Audit produced
        run: |
          test -f "docs/agent-audit/$(TZ='Asia/Shanghai' date +%Y-%m-%d)-maintainer-audit.md" \
            || { echo "FAIL: audit 未生成（含兜底）"; exit 1; }

      - name: Validate Audit format (pass 1)
        id: validate1
        run: |
          AUDIT="docs/agent-audit/$(TZ='Asia/Shanghai' date +%Y-%m-%d)-maintainer-audit.md"
          python3 .github/scripts/tafcm-maintainer/validate_audit.py "$AUDIT" \
            > .tmp/tafcm-maintainer/validate1.log 2>&1 || true
          if grep -q "格式校验通过" .tmp/tafcm-maintainer/validate1.log; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      # 校验失败 → 把 validate 错误输出回喂给 Cline 修正一次（输出纪律兜底）
      - name: Retry Maintainer Agent (fix audit format)
        if: steps.validate1.outputs.result == 'fail'
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          # 命令权限（POLICY.md §2.3）——与主 Cline 步骤一致
          CLINE_COMMAND_PERMISSIONS: |
            {
              "allow": [
                "git status",
                "git log *",
                "git diff *",
                "git show *",
                "git grep *",
                "flutter analyze *",
                "flutter test *",
                "flutter pub deps *",
                "python *",
                "python3 *",
                "pytest *",
                "gh issue list *",
                "gh issue view *",
                "gh issue create *",
                "gh issue comment *",
                "gh pr list *",
                "gh pr view *",
                "gh run list *",
                "gh run view *"
              ],
              "deny": [
                "git push *",
                "git reset *",
                "git clean *",
                "git checkout *",
                "rm -rf *",
                "rm *",
                "sudo *",
                "gh repo edit *",
                "gh secret *",
                "gh workflow *",
                "gh release *",
                "gh pr create *",
                "gh pr merge *",
                "gh pr comment *",
                "gh api *"
              ]
            }
        run: |
          set -euo pipefail
          TODAY="$(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          PROMPT="$(cat .agent/tafcm-maintainer/PROMPT.md)"
          FIX_CTX="

          ---
          ## 修正要求（Audit 机器校验未通过——必须修正后重新生成）

          上次生成的文件 docs/agent-audit/${TODAY}-maintainer-audit.md 未通过机器校验。
          校验失败原因（validate_audit.py 输出）：

          $(cat .tmp/tafcm-maintainer/validate1.log)

          请**修正或重写**该文件：严格对照 PROMPT.md §9（五块结构逐字精确、
          Status 用状态机枚举、Recommendation 用纯枚举词、必填字段一个不缺）。
          修正完成后必须自行运行 validate_audit.py 确认输出 ✅ 才算完成。
          "
          printf '%s' "${PROMPT}${FIX_CTX}" > .tmp/tafcm-maintainer/prompt_fix.txt
          python3 "$FALLBACK_RUNNER" \
            --config "$MODELS_CONFIG" \
            --prompt-file .tmp/tafcm-maintainer/prompt_fix.txt \
            --output-model-file .tmp/tafcm-maintainer/model_used_fix.json

      # 最终守门：重试后仍失败 → workflow FAILED（不伪装成功）
      - name: Validate Audit format (final gate)
        run: |
          python3 .github/scripts/tafcm-maintainer/validate_audit.py \
            "docs/agent-audit/$(TZ='Asia/Shanghai' date +%Y-%m-%d)-maintainer-audit.md"

      - name: Update Audit INDEX
        run: |
          python3 .github/scripts/tafcm-maintainer/update_index.py \
            "docs/agent-audit/$(TZ='Asia/Shanghai' date +%Y-%m-%d)-maintainer-audit.md" \
            "docs/agent-audit/INDEX.md"

      # E4 Finding Identity：计算 stable_fingerprint 并维护 FINDINGS.md 注册表
      # （机器身份锚点，Agent 下次运行读注册表做跨运行去重，替代纯 LLM 判断）
      - name: Update Finding Registry (fingerprint)
        run: |
          python3 .github/scripts/tafcm-maintainer/fingerprint.py \
            "docs/agent-audit/$(TZ='Asia/Shanghai' date +%Y-%m-%d)-maintainer-audit.md" \
            "docs/agent-audit/FINDINGS.md"

      # ---------- 3.6 Canonical Ledger（P0-2）----------
      # 账本写入一律由确定性步骤执行；Cline 没有账本写权限（治理红线 §4-5 / §4-7）。
      # LEDGER.md / ledger-metrics.json 是只读投影：改展示不碰账本，改账本重生成投影。
      - name: Ledger — append gate outcome
        if: always()
        run: |
          python3 .github/scripts/tafcm-maintainer/ledger.py append-gate \
            --gate-result .tmp/tafcm-maintainer/gate-result.json \
            --missing-reason gate_step_failed \
            --run-id "${{ github.run_id }}"

      - name: Ledger — import today's audit findings
        run: |
          python3 .github/scripts/tafcm-maintainer/ledger.py import-audit \
            --audit "docs/agent-audit/$(TZ='Asia/Shanghai' date +%Y-%m-%d)-maintainer-audit.md"

      - name: Ledger — regenerate read-only projections
        if: always()
        run: |
          python3 .github/scripts/tafcm-maintainer/ledger.py project \
            --out-md docs/agent-audit/LEDGER.md \
            --out-metrics docs/agent-audit/ledger-metrics.json

      # 完整性守门：注册表里的身份必须都能在账本里找到。两套状态并存的过渡期里，
      # 这条是"账本仍是唯一真相"的可执行定义；漂了就 FAILED，不做静默容忍。
      - name: Ledger — reconcile with finding registry
        run: python3 .github/scripts/tafcm-maintainer/ledger.py reconcile

      # ---------- 4. 越权防护（Agent 只能产生 audit/investigations 变更）----------
      # 精确前缀匹配：先剥离 porcelain 状态码（"XY path"，重命名取 new），
      # 再只放行 docs/(agent-audit|agent-investigations)/ 前缀的路径。
      # 不用子串 grep（如 other/docs/agent-audit/backup.md 会被错误放行）。
      # 注意：Guard 在 git add 之前执行，audit 文件仍是 ?? 未跟踪状态，
      # 因此必须检查完整工作树（git status），不能用 git diff --cached。
      - name: Guard — 仅允许 audit / investigations 目录变更
        run: |
          CHANGED="$(git status --porcelain \
            | sed -E 's/^.. //; s/.* -> //' \
            | grep -v -E '^docs/(agent-audit|agent-investigations)/' \
            | grep -v -E '^\.agent/tafcm-maintainer/FRONTIER\.md' \
            | grep -v -E '^flutter_app/test/golden/failures/' \
            | grep -v '^$' || true)"
          if [ -n "$CHANGED" ]; then
            echo "❌ Maintainer Agent 修改了禁止的文件："
            echo "$CHANGED"
            exit 1
          fi
          echo "✅ 变更范围合法（仅 docs/agent-audit/ 与 docs/agent-investigations/）"

      # ---------- 5. Action commit + push（Cline 无 git push 权限）----------
      - name: Commit Audit
        id: commit
        run: |
          set -euo pipefail
          TODAY="$(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/agent-audit/ docs/agent-investigations/ .agent/tafcm-maintainer/FRONTIER.md
          if git diff --cached --quiet; then
            echo "无新变更（Audit 内容与上次一致），跳过提交"
            echo "HAS_COMMIT=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(agent): daily maintainer audit ${TODAY}"
            echo "HAS_COMMIT=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Audit
        if: steps.commit.outputs.HAS_COMMIT == 'true'
        run: |
          git push origin "HEAD:${TARGET_BRANCH}"

      # ---------- 6. 机器可读报告 + 邮件（独立脚本；失败不连坐 Audit）----------
      - name: Log effective model (fallback attribution)
        if: always()
        run: |
          for f in .tmp/tafcm-maintainer/model_used_main.json \
                   .tmp/tafcm-maintainer/model_used_fix.json; do
            [ -f "$f" ] && echo "MODEL_USED $(basename "$f"): $(cat "$f")"
          done

      - name: Generate report
        id: report
        run: |
          python3 .github/scripts/tafcm-maintainer/generate_report.py \
            "docs/agent-audit/$(TZ='Asia/Shanghai' date +%Y-%m-%d)-maintainer-audit.md" \
            --out .tmp/tafcm-maintainer/report.json

      - name: Send email report
        id: email
        if: always()
        continue-on-error: true   # 邮件失败不导致 Audit 丢失；由 status 步骤明确报告
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 .github/scripts/tafcm-maintainer/send_report.py \
            .tmp/tafcm-maintainer/report.json

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tafcm-maintainer-${{ github.run_id }}
          path: |
            .tmp/tafcm-maintainer/cline-result.json
            .tmp/tafcm-maintainer/report.json
            .tmp/tafcm-maintainer/gate-result.json
            .tmp/tafcm-maintainer/gate-failure.json
            .tmp/tafcm-maintainer/model_used_main.json
            .tmp/tafcm-maintainer/model_used_fix.json
          retention-days: 30
          if-no-files-found: warn

      # ---------- 7. 状态汇总（明确区分 Audit / Email 成败）----------
      - name: Report status
        if: always()
        run: |
          TODAY="$(TZ='Asia/Shanghai' date +%Y-%m-%d)"
          if [ "${{ steps.email.outcome }}" = "failure" ]; then
            echo "============================================"
            echo "Audit completed but email delivery failed."
            echo "Audit = SUCCESS | Email = FAILED"
            echo "Audit 文件：docs/agent-audit/${TODAY}-maintainer-audit.md（已提交）"
            echo "============================================"
            exit 0   # Audit 成功，不因邮件失败使 workflow 变红
          else
            echo "============================================"
            echo "Audit completed and email delivered."
            echo "Audit = SUCCESS | Email = SUCCESS"
            echo "============================================"
          fi

  # ---------- 8. Weekly Digest（周五 10:00 UTC = 18:00 北京时间）----------
  # 独立 job：只读最近 audit 文件合成状态变化摘要邮件，不跑审查。
  # 最小权限：contents: read（读仓库 audit）；不发审计、不建 Issue、无写权。
  weekly-digest:
    name: Weekly Digest (Friday 18:00 CST)
    if: github.event.schedule == '0 10 * * 5' || github.event.inputs.force_digest == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Send Weekly Digest email
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          python3 .github/scripts/tafcm-maintainer/send_report.py \
            --mode digest \
            --audit-dir docs/agent-audit/ \
            --days 7

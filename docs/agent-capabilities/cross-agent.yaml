# Cross-Agent Capability Matrix — Cline × Doubao
# 维护：Doubao Supervisor · 首版 2026-09-04 · 基于真实交接案例

# 分工原则：Cline = 持续观察/Ledger（7×24 GitHub-native）；Doubao = 深度调查/验证/监督；Human = 决策/授权/合入

complementary_factories:
  - flow: "Cline 每日 audit → Doubao 周度监督 + 深度根因 → Human 裁决"
    evidence: "2026-09-04: Cline 9-04 audit 丢失 → Doubao 定位 Guard 根因 → PR #251（Human 已合并）"
  - flow: "Cline PR review 初筛 → Doubao 深度代码/性能审查 → Human 合入"
    evidence: "性能审查 #245-250（Doubao）+ PR review（Cline 独立发现 validate id 缺口）"
  - flow: "Cline 标记 needs-device-validation → Doubao/真机执行 → Evidence 回流"
    evidence: "Cline audit Pending: #216 真机 PoC 验证 PNG alpha 通道（F-2026-09-01-02）——待执行"

matrix:
  - capability: "每日仓库观察 / Audit / 去重记忆"
    cline: "proven (7×24 schedule, INDEX/FINDINGS/FRONTIER)"
    doubao: "not-required (监督不重复 audit)"
    owner: cline
  - capability: "GitHub-native 事件触发（issue→workflow）"
    cline: "proven (schedule + workflow_dispatch)"
    doubao: "partial (on-demand via cron/task)"
    owner: cline
  - capability: "深度代码 / 性能 / PM 审查"
    cline: "failed_under_conditions (breadth-scoped, shallow)"
    doubao: "proven (#238-250)"
    owner: doubao
  - capability: "浏览器 GUI 验证（真实网站渲染/截图）"
    cline: "blocked_by_environment (headless runner)"
    doubao: "proven (EXP D-01)"
    owner: doubao
  - capability: "GitHub 写操作（Issue/PR/分支/推送）"
    cline: "blocked_by_policy (push/merge denied; issue create allowed)"
    doubao: "proven (via PAT REST, #238-252)"
    owner: doubao + human-merge
  - capability: "复杂根因调查 + 修复方案起草"
    cline: "partial (PR review 层面)"
    doubao: "proven (Guard #251, #216 investigation)"
    owner: doubao
  - capability: "真机 / 物理设备验证"
    cline: "blocked_by_environment"
    doubao: "unknown (无设备)"
    owner: human / device-runtime
  - capability: "规则修改（PROMPT/POLICY/SCHEMA）"
    cline: "blocked_by_policy (不能改自己规则)"
    doubao: "conditional (起草 PR，Human 合入, SUP-03)"
    owner: doubao-draft + human-approve

# 交接边界
handoff_notes:
  - blocker: "Cline 无 push/merge 权限 → 产物由 workflow 代提交或 Doubao PR"
    receiver: "doubao (PR #251/#252) 或 workflow Guard+commit"
    evidence: "PR #251 Guard 修复"
  - blocker: "Cline 无运行环境验证真机/浏览器 → needs-device-validation handoff"
    receiver: "doubao (browser D-01 proven) / human (device)"
    evidence: "D-01 + FRONTIER verification_status: needs-device-validation"
  - blocker: "Doubao 无 7×24 常驻 → 依赖 cron 触发周度 pass"
    receiver: "cline (每日观察保持连续性)"
    evidence: "tafcm-maintainer cron 01:23 CST"

